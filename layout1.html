<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Grid</title>
  <link rel="stylesheet" href="grids.css">
    <style>
        .topo{
            border: 1px solid #000000;
            margin-bottom: 5px;
            height: 80px;
        }
        .Menu{
            border: 1px solid black;
            height: 30px;
        }
        .colunaA{
            border: 1px solid #000000;
            height: 400px;
            margin-bottom: 5px;
        }
        .colunaB{
            border: 1px solid #000000;
             height: 400px;
             margin-bottom: 5px;
        }
        .rodape{
            border: 1px solid #000000;
        }
    </style>
</head>
<body>

    <div class="container">
         <a href="index.html">Voltar</a>

        <div class="row">
            <div class="col-12 topo">
                <h1>Topo</h1>
            </div>
                
        </div>

        <div class="row">
            <div class="col-12 menu">
                <h1>Menu</h1>
            </div>

        </div>
       
        <div class="row gap-1">
            <div class="col-6 colunaA">ColunaA</div>
            <div class="col-6 colunaB">ColunaB</div>
        </div>

        <div class="row">
            <div class="col-12 rodape">Rodapé</div>
        </div>

    </div>


    
</body>
</html>
